name: myslt_app_2026
description: "mySLT - Sri Lanka Telecom Self-Care App"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.1

  # Networking
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.2

  # UI & Fonts
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  pin_code_fields: ^8.0.1

  # Charts
  fl_chart: ^0.69.0

  # Localization
  easy_localization: ^3.0.7+1

  # Utilities
  dartz: ^0.10.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/


